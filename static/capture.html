<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Capture &middot; LocalPulse</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LocalPulse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="cam">
<div class="stage">
  <video id="video" playsinline autoplay muted></video>
  <img id="ghost" class="ghost hidden" alt="">
  <div class="guides" id="guides">
    <span class="v" style="left:33.33%"></span>
    <span class="v" style="left:66.66%"></span>
    <span class="h" style="top:33.33%"></span>
    <span class="h" style="top:66.66%"></span>
  </div>
  <div class="flash" id="flash"></div>

  <div class="cam-top">
    <div>
      <div class="pose" id="pose-label">Front</div>
      <div class="sub" id="pose-sub">Pose 1 of 2</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="icon-btn" id="btn-toggle-back" title="Toggle back photo tracking" aria-label="Toggle back photo" style="font-size:12px;width:auto;padding:0 10px;height:32px;border-radius:16px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.2);color:#fff">Back: OFF</button>
      <a class="x" href="/" aria-label="Close">&times;</a>
    </div>
  </div>

  <div class="cam-bottom">
    <div class="opacity-row" id="opacity-row">
      <span>Ghost</span>
      <input type="range" id="opacity" min="0" max="70" value="35" aria-label="Ghost overlay opacity">
      <span id="opacity-val" style="min-width:34px;text-align:right">35%</span>
    </div>
    <div class="shutter-row">
      <button class="icon-btn" id="btn-timer" aria-label="Self-timer">3s</button>
      <button class="shutter" id="shutter" aria-label="Take photo"></button>
      <button class="icon-btn" id="btn-upload" aria-label="Upload photo from files" title="Upload from files" style="font-size:17px">&#128194;</button>
      <button class="icon-btn" id="btn-flip" aria-label="Switch camera">&#8635;</button>
    </div>
  </div>

  <input type="file" id="file-upload" accept="image/*" class="hidden">

  <!-- Photo review / retake overlay -->
  <div class="cam-review hidden" id="review-overlay">
    <div class="review-top">
      <div>
        <div class="pose" id="review-pose-label">Review Front</div>
        <div class="sub">Check framing &amp; orientation before saving</div>
      </div>
    </div>
    <div class="review-preview-wrap">
      <img id="review-img" class="review-img" alt="Captured preview">
    </div>
    <div class="review-bottom">
      <div class="review-row">
        <button type="button" class="icon-btn review-btn" id="btn-review-retake" title="Retake photo" aria-label="Retake photo">&#8634; Retake</button>
        <button type="button" class="icon-btn review-btn" id="btn-review-rotate" title="Rotate 90° clockwise" aria-label="Rotate">&#8635; Rotate</button>
        <button type="button" class="icon-btn review-btn" id="btn-review-flip" title="Mirror horizontally" aria-label="Mirror">&#8646; Flip</button>
        <button type="button" class="btn btn-primary btn-keep" id="btn-review-save" aria-label="Keep photo">Keep Photo &#10003;</button>
      </div>
    </div>
  </div>

  <!-- Transparent countdown overlay for ghost alignment during timer -->
  <div class="cam-countdown hidden" id="countdown-overlay">
    <div class="countdown-badge">
      <span id="countdown-num">3</span>
    </div>
  </div>

  <!-- Terminal status overlay (finish / error) -->
  <div class="cam-msg hidden" id="msg">
    <div class="inner" id="msg-inner"></div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>
<script type="module" src="/static/js/capture.js?v=20261005"></script>
</body>
</html>
